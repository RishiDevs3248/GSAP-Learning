<body>

    <div id="string">

        <svg width="1000" height="300">
            <path d="M 10 100 Q 500 100 990 100" stroke="white" fill="none" />
        </svg>
        
        <!-- 
        
        d="M 10 80 Q 95 10 180 80" 
        Start point  -> M 10 80 -> M x-axis y-axis
                                   |    |     |
                                   M   10     80   


        Quadratic curve -> Q 95 10 180 80

        95 10 -> center point - x-axis y-axis

        180 80 -> end point - x-axis y-axis


        -->

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    
    <script src="script.js"></script>
</body>
